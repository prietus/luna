[package]
name = "luna"
version = "0.1.3"
edition = "2024"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
gtk4-layer-shell = "0.8.1"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
